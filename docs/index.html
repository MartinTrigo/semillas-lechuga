<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b2a">
  <title>Semillas de Lechuga</title>
  <meta name="description" content="Seguimiento de la selección y producción de semilla propia de seis variedades de lechuga para un mix de baby leaf. Prácticas del curso de Operador Hortícola.">

  <!-- La app no carga nada de afuera: ni tipografías, ni librerías, ni imágenes
       de otros sitios. Eso permite declarar de dónde puede venir cada cosa y
       que el navegador rechace todo lo demás. Si alguna vez se colara un script
       ajeno, no llega a ejecutarse. Lo único externo permitido es el servicio de
       la planilla de Google, que es a donde se envían los registros. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    manifest-src 'self';
    connect-src 'self' https://script.google.com https://script.googleusercontent.com;
    base-uri 'none';
    form-action 'none';
    object-src 'none'">

  <!-- Al abrir un enlace externo no se le cuenta de dónde salió. -->
  <meta name="referrer" content="no-referrer">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="barra">
      <button class="volver" id="btn-volver" hidden aria-label="Volver">&#8592;</button>
      <div class="barra__texto">
        <h1 id="titulo-vista">Semillas de Lechuga</h1>
        <p id="subtitulo-vista">Seguimiento del mix baby leaf</p>
      </div>
    </div>
  </header>

  <main id="vista" class="vista">
    <p class="cargando">Cargando&hellip;</p>
  </main>

  <footer class="pie">
    <p><strong>Semillas de Lechuga</strong></p>
    <p>Selecci&oacute;n y producci&oacute;n de semilla propia &middot; Curso de Operador Hort&iacute;cola</p>
    <p class="pie__version" id="pie-version"></p>
  </footer>

  <noscript>
    <p class="aviso aviso--error">Esta aplicación necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/util.js"></script>
  <script src="js/acceso.js"></script>
  <script src="js/db.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/etapas.js"></script>
  <script src="js/campos.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/registro.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/sincro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
